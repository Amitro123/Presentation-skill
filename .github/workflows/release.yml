name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/package_skill.py --check
      - name: Create GitHub release with the .skill file
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" html-presentation.skill --title "${{ github.ref_name }}" --generate-notes --verify-tag
