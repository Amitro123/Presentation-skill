name: Release

# Two ways to release:
#  - push a tag vX.Y.Z, or
#  - run this workflow by hand (Actions -> Release -> Run workflow, works from a phone browser):
#    it creates the tag on the chosen commit of main.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.2.0 (must match plugin/.claude-plugin/plugin.json)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Packaged skill and plugin are up to date
        run: python3 tools/package_skill.py --check
      - name: Tag matches plugin version
        run: |
          want="v$(python3 -c 'import json;print(json.load(open("plugin/.claude-plugin/plugin.json"))["version"])')"
          [ "$TAG" = "$want" ] || { echo "::error::tag $TAG does not match plugin.json version $want"; exit 1; }
      - name: Create GitHub release with the .skill file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release create "$TAG" html-presentation.skill --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          else
            gh release create "$TAG" html-presentation.skill --title "$TAG" --generate-notes --verify-tag
          fi
